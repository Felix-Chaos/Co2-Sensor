; PlatformIO Project Configuration
; TTGO T-Display ESP32 + SCD30 CO2 Sensor + MQTT Home Assistant Dashboard
;
; Board: LilyGO TTGO T-Display (ESP32 + 1.14" ST7789 TFT 135x240)
; Sensor: Sensirion SCD30 (CO2, Temperature, Humidity) via I2C
;

[env:ttgo-t-display]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino

; Load credentials from .env file
extra_scripts = pre:load_env.py

; Use the ESP32 partition scheme with more program space
board_build.partitions = min_spiffs.csv

monitor_speed = 115200

lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    sparkfun/SparkFun SCD30 Arduino Library @ ^1.0.20

build_flags = 
    ; ---- TFT_eSPI Configuration for TTGO T-Display ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
